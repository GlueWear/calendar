<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Calendar 365K</title>
<style>
:root{--bg:#080808;--panel:#151515;--panel2:#1d1510;--line:#ff8a00;--line2:#8b4b08;--text:#dedede;--dim:#858585;--amber:#ffaa00;--orange:#ff6a00;--cyan:#65d6e8;--blue:#569cd6;--green:#80ff45;--red:#ff3b22;--shadow:rgba(255,138,0,.28)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 50% -15%,rgba(255,170,0,.16),transparent 34%),linear-gradient(135deg,#090202,#080808 50%,#120600);color:var(--text);font-family:"Share Tech Mono","IBM Plex Mono","Courier New",monospace;letter-spacing:.02em}button,input,textarea,select{font:inherit}button{cursor:pointer}body{display:flex;justify-content:center}.shell{width:100%;min-height:100vh;position:relative;overflow:hidden}.shell:before{content:"";position:fixed;inset:0;pointer-events:none;background:linear-gradient(rgba(255,170,0,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(255,170,0,.035) 1px,transparent 1px);background-size:34px 34px;mask-image:radial-gradient(circle at center,#000 0,#000 45%,transparent 82%)}.head{height:54px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:.8rem;padding:0 1rem;background:rgba(8,8,8,.82);box-shadow:0 0 20px var(--shadow);position:relative;z-index:1}.brand{color:var(--amber);font-weight:800;letter-spacing:.15em;text-shadow:0 0 10px var(--shadow)}.chip{border:1px solid var(--line2);color:var(--cyan);padding:.2rem .45rem;font-size:.65rem}.mode{margin-left:auto;color:var(--dim);font-size:.68rem}.body{position:relative;z-index:1;padding:1rem}.full{max-width:1120px;margin:0 auto}.topbar{display:flex;align-items:center;gap:.5rem;margin-bottom:.75rem}.title{font-size:1.35rem;color:var(--amber);margin-right:auto}.btn{border:1px solid var(--line2);background:#181008;color:var(--text);padding:.48rem .7rem;text-decoration:none;clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px)}.btn:hover{border-color:var(--amber);color:var(--amber)}.btn.primary{background:var(--amber);border-color:var(--amber);color:#080808;font-weight:800}.btn.danger{border-color:var(--red);color:var(--red)}.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:.35rem}.dow{color:var(--dim);font-size:.72rem;text-transform:uppercase;padding:.35rem}.day{min-height:116px;border:1px solid #34220b;background:rgba(15,15,15,.88);padding:.45rem;position:relative;clip-path:polygon(10px 0,100% 0,100% 100%,0 100%,0 10px)}.day.today{border-color:var(--cyan);box-shadow:inset 0 0 0 1px rgba(101,214,232,.35)}.day.muted{opacity:.42}.date{font-size:.75rem;color:var(--amber);margin-bottom:.35rem}.today .date{color:var(--cyan)}.event-pill{display:block;width:100%;border:1px solid rgba(255,170,0,.28);background:rgba(255,106,0,.12);color:var(--text);padding:.25rem .35rem;margin:.2rem 0;text-align:left;font-size:.72rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.event-pill.saved{border-color:rgba(128,255,69,.4);background:rgba(128,255,69,.1)}.event-pill.cancelled{border-color:rgba(255,59,34,.5);color:var(--red)}.panel{border:1px solid var(--line2);background:rgba(12,12,12,.94);padding:.8rem;clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px)}.overlay{position:fixed;inset:0;background:rgba(0,0,0,.68);display:none;align-items:center;justify-content:center;padding:1rem;z-index:5}.overlay.open{display:flex}.modal{width:min(560px,100%);border:1px solid var(--line);background:#090909;box-shadow:0 0 36px var(--shadow);padding:1rem;clip-path:polygon(18px 0,100% 0,100% calc(100% - 18px),calc(100% - 18px) 100%,0 100%,0 18px)}.modal h2{margin:.1rem 0 .9rem;color:var(--amber);font-size:1.05rem}.fields{display:grid;grid-template-columns:1fr 1fr;gap:.7rem}.field{display:flex;flex-direction:column;gap:.25rem;margin-bottom:.7rem}.field.fullspan{grid-column:1/-1}label{font-size:.65rem;color:var(--dim);text-transform:uppercase}input,textarea,select{width:100%;border:1px solid #3a2a10;background:#050505;color:var(--text);padding:.55rem;outline:none}input:focus,textarea:focus,select:focus{border-color:var(--amber)}textarea{resize:vertical;min-height:70px}.actions{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}.status{font-size:.68rem;color:var(--dim);margin-left:auto}.card-title{font-size:1.15rem;color:var(--amber);margin-bottom:.4rem}.meta{font-size:.72rem;color:var(--dim);line-height:1.55}.bigtime{font-size:1.6rem;color:var(--cyan);margin:.25rem 0}.artifact{max-width:680px;margin:0 auto}.list-row{display:flex;gap:.5rem;align-items:center;border-top:1px solid #2a1d0b;padding:.55rem 0}.list-row:first-child{border-top:0}.list-row-main{flex:1;min-width:0}.empty{color:var(--dim);border:1px dashed #3a2a10;padding:1rem;text-align:center}.mini-note{font-size:.68rem;color:var(--dim);margin-top:.4rem}
@media(max-width:760px){.grid{gap:.22rem}.day{min-height:86px;padding:.32rem}.event-pill{font-size:.66rem}.fields{grid-template-columns:1fr}.topbar{flex-wrap:wrap}.title{width:100%}}
</style>
</head>
<body>
<main class="shell">
  <header class="head"><span class="brand">CALENDAR</span><span class="chip">365K</span><span class="mode" id="modeLabel">APP</span></header>
  <section class="body" id="root"></section>
</main>
<div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>
<script>
const PROTOCOL=1,DESK='calendar',STORE='calendar-365k-events-v1';
let session=null,context=null,shown=new Date(),editing=null;
const root=document.getElementById('root'),modeLabel=document.getElementById('modeLabel'),overlay=document.getElementById('overlay'),modal=document.getElementById('modal');
const pad=n=>String(n).padStart(2,'0'),ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function send(type,payload){parent.postMessage({source:'noltbook-plugin',protocol:PROTOCOL,session,type,payload:payload||{}},'*')}
function resize(){requestAnimationFrame(()=>{if(parent!==window)send('nb:resize',{height:Math.max(190,Math.min(760,document.documentElement.scrollHeight+8))})})}
function load(){try{return JSON.parse(localStorage.getItem(STORE)||'[]')}catch(e){return[]}}
function save(events){localStorage.setItem(STORE,JSON.stringify(events));}
function id(){return 'ev-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,8)}
function eventKey(e){return (e.creator||'local')+':'+e.id}
function upsert(ev){const xs=load(),k=eventKey(ev),i=xs.findIndex(x=>eventKey(x)===k);if(i>=0)xs[i]={...xs[i],...ev,saved:true};else xs.push({...ev,saved:true});save(xs)}
function removeEvent(ev){save(load().filter(x=>eventKey(x)!==eventKey(ev)))}
function formatDate(ev){const d=new Date((ev.date||ymd(new Date()))+'T'+(ev.time||'00:00'));return d.toLocaleDateString([], {weekday:'short',month:'short',day:'numeric',year:'numeric'})}
function formatTime(ev){return ev.time?ev.time+(ev.endTime?'–'+ev.endTime:''):'All day'}
function reminderLabel(v){return ({none:'None','1h':'1 hour before','1d':'1 day before','1w':'1 week before'}[v||'1h']||v)}
function eventRef(ev){return JSON.stringify({type:'calendar-event-ref',desk:DESK,creator:ev.creator||'local',id:ev.id,title:ev.title,date:ev.date,time:ev.time},null,2)}
function parseMaybeArtifact(a){try{let raw=a.latestVersion&&a.latestVersion.content;if(!raw&&a.versions&&a.versions[0])raw=a.versions[0].content;return typeof raw==='string'?JSON.parse(raw):raw}catch(e){return null}}
function eventFromForm(seed){return {id:(seed&&seed.id)||id(),creator:(seed&&seed.creator)||'local',kind:'calendar-event',title:val('title')||'Untitled Event',date:val('date')||ymd(new Date()),time:val('time'),endTime:val('endTime'),location:val('location'),notes:val('notes'),reminder:val('reminder')||'1h',createdAt:(seed&&seed.createdAt)||Date.now(),updatedAt:Date.now(),sourceNoteId:(context&&context.noteId)||(seed&&seed.sourceNoteId)||null,cancelled:false}}
function val(id){const el=document.getElementById(id);return el?el.value.trim():''}
function formHtml(ev,heading){ev=ev||{};return `<h2>${esc(heading||'CREATE EVENT')}</h2><div class="fields">
<div class="field fullspan"><label>Title</label><input id="title" maxlength="128" value="${esc(ev.title||'')}"></div>
<div class="field"><label>Date</label><input id="date" type="date" value="${esc(ev.date||ymd(new Date()))}"></div>
<div class="field"><label>Start time</label><input id="time" type="time" value="${esc(ev.time||'')}"></div>
<div class="field"><label>End time</label><input id="endTime" type="time" value="${esc(ev.endTime||'')}"></div>
<div class="field"><label>Reminder</label><select id="reminder"><option value="none">None</option><option value="1h">1 hour before</option><option value="1d">1 day before</option><option value="1w">1 week before</option></select></div>
<div class="field fullspan"><label>Location</label><input id="location" maxlength="160" value="${esc(ev.location||'')}"></div>
<div class="field fullspan"><label>Notes</label><textarea id="notes">${esc(ev.notes||'')}</textarea></div></div>`}
function openForm(seed,opts={}){overlay.classList.add('open');modal.innerHTML=formHtml(seed,opts.heading)+`<div class="actions"><button class="btn primary" id="saveBtn">${opts.publish?'PUBLISH EVENT':'SAVE EVENT'}</button><button class="btn" id="cancelBtn">CLOSE</button><span class="status" id="status"></span></div>`;document.getElementById('reminder').value=seed&&seed.reminder||'1h';document.getElementById('cancelBtn').onclick=closeModal;document.getElementById('saveBtn').onclick=()=>{const ev=eventFromForm(seed);upsert(ev);if(opts.publish){status('Publishing...');send('nb:publish',{name:ev.title,data:{kind:'calendar-event',event:ev}})}else{closeModal();renderFull()}}}
function closeModal(){overlay.classList.remove('open');modal.innerHTML=''}
function status(t,c){const el=document.getElementById('status');if(el){el.textContent=t;el.style.color=c||'var(--dim)'}}
function openDetail(ev){overlay.classList.add('open');const mine=(ev.creator||'local')==='local';modal.innerHTML=`<h2>${esc(ev.title)}</h2><div class="meta">${esc(formatDate(ev))}</div><div class="bigtime">${esc(formatTime(ev))}</div><div class="meta">${ev.location?'LOCATION: '+esc(ev.location)+'<br>':''}REMINDER: ${esc(reminderLabel(ev.reminder))}${ev.notes?'<br><br>'+esc(ev.notes):''}</div><div class="actions" style="margin-top:1rem">
${mine?'<button class="btn primary" id="editBtn">EDIT</button>':''}<button class="btn" id="copyBtn">COPY REF</button><button class="btn danger" id="removeBtn">${mine?'DELETE LOCAL':'REMOVE REMINDER'}</button><button class="btn" id="closeBtn">CLOSE</button><span class="status" id="status"></span></div>`;document.getElementById('closeBtn').onclick=closeModal;document.getElementById('copyBtn').onclick=()=>navigator.clipboard.writeText(eventRef(ev)).then(()=>status('Reference copied','var(--green)'));document.getElementById('removeBtn').onclick=()=>{removeEvent(ev);closeModal();renderFull()};if(mine)document.getElementById('editBtn').onclick=()=>openForm(ev,{heading:'EDIT EVENT'})}
function renderFull(){modeLabel.textContent='FULL CALENDAR';const year=shown.getFullYear(),month=shown.getMonth(),first=new Date(year,month,1),start=new Date(first);start.setDate(1-first.getDay());const today=ymd(new Date()),events=load();root.innerHTML=`<div class="full"><div class="topbar"><div class="title">${shown.toLocaleString([], {month:'long',year:'numeric'})}</div><button class="btn" id="prev">◀</button><button class="btn" id="today">TODAY</button><button class="btn" id="next">▶</button><button class="btn primary" id="new">NEW EVENT</button></div><div class="grid" id="cal"></div></div>`;document.getElementById('prev').onclick=()=>{shown.setMonth(month-1);renderFull()};document.getElementById('next').onclick=()=>{shown.setMonth(month+1);renderFull()};document.getElementById('today').onclick=()=>{shown=new Date();renderFull()};document.getElementById('new').onclick=()=>openForm({date:today},{heading:'CREATE PRIVATE EVENT'});const cal=document.getElementById('cal');['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].forEach(d=>cal.insertAdjacentHTML('beforeend',`<div class="dow">${d}</div>`));for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);const date=ymd(d),dayEvents=events.filter(e=>e.date===date).sort((a,b)=>(a.time||'').localeCompare(b.time||''));const cls=['day',date===today?'today':'',d.getMonth()!==month?'muted':''].join(' ');cal.insertAdjacentHTML('beforeend',`<div class="${cls}" data-date="${date}"><div class="date">${d.getDate()}</div>${dayEvents.slice(0,4).map(e=>`<button class="event-pill ${e.cancelled?'cancelled':'saved'}" data-key="${esc(eventKey(e))}">${esc(e.time?e.time+' ':'')}${esc(e.title)}</button>`).join('')}${dayEvents.length>4?`<div class="meta">+${dayEvents.length-4} more</div>`:''}</div>`)}cal.querySelectorAll('.day').forEach(el=>el.onclick=e=>{if(e.target.classList.contains('event-pill'))return;openForm({date:el.dataset.date},{heading:'CREATE PRIVATE EVENT'})});cal.querySelectorAll('.event-pill').forEach(b=>b.onclick=()=>openDetail(events.find(e=>eventKey(e)===b.dataset.key)));resize()}
function renderTool(){modeLabel.textContent='NOTE TOOL';root.innerHTML=`<div class="artifact panel"><div class="card-title">CALENDAR TOOL</div><div class="meta">Create a shareable event for this note, or post a lightweight list of upcoming Calendar artifacts already found here.</div><div class="actions" style="margin-top:.9rem"><button class="btn primary" id="make">CREATE EVENT</button><button class="btn" id="upcoming">POST UPCOMING IN NOTE</button><button class="btn" id="close">CLOSE</button><span class="status" id="status"></span></div><div class="mini-note">${esc((context&&context.noteId)||'no note context')}</div></div>`;document.getElementById('make').onclick=()=>openForm({date:ymd(new Date())},{heading:'CREATE NOTE EVENT',publish:true});document.getElementById('upcoming').onclick=postUpcoming;document.getElementById('close').onclick=()=>send('nb:close');resize()}
async function noteEvents(){const nid=context&&context.noteId;if(!nid)return[];try{const res=await fetch('/~/scry/noltbook/api/notes/'+encodeURIComponent(nid)+'.json');const note=await res.json();const out=[];(note.artifacts||[]).forEach(a=>{const d=parseMaybeArtifact(a);if(d&&d.kind==='calendar-event'&&d.event)out.push(d.event);if(d&&d.kind==='calendar-event-list'&&Array.isArray(d.events))out.push(...d.events)});const today=ymd(new Date());return out.filter(e=>e.date>=today).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time))}catch(e){return[]}}
async function postUpcoming(){status('Scanning note...','var(--amber)');const events=await noteEvents();if(!events.length){status('No upcoming events found','var(--red)');return}send('nb:publish',{name:'Upcoming Calendar Events',data:{kind:'calendar-event-list',events:events.slice(0,20),sourceNoteId:context&&context.noteId,createdAt:Date.now()}})}
function renderEventArtifact(ev){const saved=load().some(x=>eventKey(x)===eventKey(ev));root.innerHTML=`<div class="artifact panel"><div class="card-title">${esc(ev.title||'Calendar event')}</div><div class="meta">${esc(formatDate(ev))}</div><div class="bigtime">${esc(formatTime(ev))}</div><div class="meta">${ev.location?'LOCATION: '+esc(ev.location)+'<br>':''}${ev.notes?esc(ev.notes)+'<br>':''}REMINDER AFTER ADD: ${esc(reminderLabel(ev.reminder))}</div><div class="actions" style="margin-top:.9rem"><button class="btn primary" id="add">${saved?'SAVED':'ADD TO CALENDAR'}</button><button class="btn" id="copy">COPY REF</button><button class="btn" id="close">PAUSE</button><span class="status" id="status"></span></div></div>`;document.getElementById('add').disabled=saved;document.getElementById('add').onclick=()=>{upsert(ev);document.getElementById('add').textContent='SAVED';document.getElementById('add').disabled=true;status('Added to your calendar','var(--green)')};document.getElementById('copy').onclick=()=>navigator.clipboard.writeText(eventRef(ev)).then(()=>status('Reference copied','var(--green)'));document.getElementById('close').onclick=()=>send('nb:close');resize()}
function renderListArtifact(events){events=(events||[]).filter(e=>e.date>=ymd(new Date())).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));root.innerHTML=`<div class="artifact panel"><div class="card-title">UPCOMING EVENTS</div>${events.length?events.map((e,i)=>`<div class="list-row"><div class="list-row-main"><div>${esc(e.title)}</div><div class="meta">${esc(formatDate(e))} · ${esc(formatTime(e))}${e.location?' · '+esc(e.location):''}</div></div><button class="btn" data-add="${i}">ADD</button></div>`).join(''):'<div class="empty">No upcoming events.</div>'}<div class="actions" style="margin-top:.75rem"><button class="btn" id="close">PAUSE</button><span class="status" id="status"></span></div></div>`;root.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{upsert(events[Number(b.dataset.add)]);b.textContent='SAVED';b.disabled=true});document.getElementById('close').onclick=()=>send('nb:close');resize()}
function renderArtifact(){modeLabel.textContent='NOTE ARTIFACT';const d=(context&&context.artifact&&context.artifact.data)||{};if(d.kind==='calendar-event')renderEventArtifact(d.event||{});else if(d.kind==='calendar-event-list')renderListArtifact(d.events||[]);else root.innerHTML='<div class="artifact panel"><div class="empty">Unknown Calendar artifact.</div></div>';resize()}
window.addEventListener('message',e=>{if(e.source!==parent)return;const d=e.data;if(!d||d.source!=='noltbook-host'||d.protocol!==PROTOCOL)return;if(d.type==='nb:init'){session=d.session;context=d.payload;if(context.mode==='private-tool')renderTool();else renderArtifact()}else if(d.session!==session)return;else if(d.type==='nb:publish-result'){if(d.payload&&d.payload.ok){status('Published','var(--green)');setTimeout(()=>send('nb:close'),500)}else status('Publish failed','var(--red)')}})
overlay.addEventListener('click',e=>{if(e.target===overlay)closeModal()});
if(window.parent===window)renderFull();else parent.postMessage({source:'noltbook-plugin',protocol:PROTOCOL,type:'nb:ready'},'*');
</script>
</body>
</html>
